name: tradetally-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-trader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-tradetally}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trader} -d ${DB_NAME:-tradetally}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_API_URL: /api
        CODEX_CLI_VERSION: "0.160.0"
    image: tradetally-local:latest
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${TRADETALLY_PRODUCTION_ENV_FILE:?Use scripts/production-compose.ps1 or set the external production environment file}
    environment:
      CODEX_HOME: /home/appuser/.codex
      CODEX_CLI_AUTH_MODE: chatgpt
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - uploads:/app/backend/uploads
      - app_data:/app/backend/src/data
      - app_logs:/app/backend/src/logs
      - codex_auth:/home/appuser/.codex
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  app_data:
  app_logs:
  codex_auth:
